nmax(0,1fr));gap:15px;margin-top:17px}.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.card-title{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:15px}.card-title .ico{color:var(--blue)}.balance-card{min-height:173px;position:relative;overflow:hidden}.balance-card.cash{background:linear-gradient(135deg,#08664e,#0c9a70);color:#fff;border:0}.balance-card.savings{background:linear-gradient(135deg,#2148a8,#3676dd);color:#fff;border:0}.balance-card:after{content:"";position:absolute;right:-70px;top:-95px;width:220px;height:220px;border-radius:50%;border:1px solid #ffffff45;box-shadow:0 0 0 24px #ffffff0a,0 0 0 50px #ffffff08;pointer-events:none}.balance-card>*{position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:.06em;font-weight:800;opacity:.86}.balance-number{font-size:clamp(28px,4vw,40px);font-weight:850;letter-spacing:-1px;margin:7px 0}.balance-sub{font-size:12px;opacity:.9}.balance-card button{background:#ffffff1c;border-color:#ffffff5a;color:#fff;margin-top:12px}.stat{font-size:24px;font-weight:800}.mini{font-size:12px;color:var(--muted)}.tone-green{color:var(--green)}.tone-blue{color:var(--blue)}.tone-coral{color:var(--coral)}.tone-gold{color:var(--gold)}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}.line:first-child{border-top:0}.line-main{min-width:0;overflow-wrap:anywhere}.line small{display:block}.line-actions{display:flex;align-items:center;gap:6px;flex:none}.pill{display:inline-flex;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:750}.pill.green{background:var(--green-soft);color:var(--green)}.pill.blue{background:var(--blue-soft);color:var(--blue)}.pill.coral{back <body>
<div class="app">
<aside class="side" aria-label="Navegación principal">
  <div class="brand"><img src="./icons/icon-192.png" alt=""><div><strong>Mi economía personal</strong><small>Control guardado en este dispositivo</small></div></div>
  <nav class="nav" id="nav" aria-label="Secciones"></nav>
  <div class="side-foot">Sin cuenta externa · sin servicios de IA</div>
</aside>
<main class="main">
  <header class="topbar">
    <label><span>MES DEL REGISTRO</span><input id="monthPicker" type="month" aria-label="Mes del registro"></label>
    <label class="search"><span>BUSCAR MOVIMIENTOS</span><input id="searchInput" type="search" placeholder="Concepto o categoría" autocomplete="off"></label>
    <button id="hideAmounts" class="quiet" aria-label="Ocultar montos" title="Ocultar o mostrar montos">Ocultar montos</button>
    <button id="themeButton" class="quiet" aria-label="Cambiar tema">Modo oscuro</button>
    <div id="searchResults" class="search-results" role="listbox" aria-label="Resultados de búsqueda"></div>
  </header>
  <section id="content" class="content" tabindex="-1"></section>
</main>
</div>
<button class="fab no-print" id="fab" aria-label="Registrar movimiento" title="Registrar movimiento">+</button>
<div class="modal-backdrop" id="modalBackdrop" role="presentation">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" aria-label="Cerrar">Cerrar</button></div>
    <div id="modalBody"></div>
  </section>
</div>
<div id="lockScreen" hidden style="position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center;padding:24px"><section class="card" style="width:min(420px,100%)"><h1>Sesión bloqueada</h1><p>Ingresa tu PIN para continuar.</p><label>PIN de 4 a 8 números<input id="unlockPin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></label><p id="pinError" role="alert" class="tone-coral"></p><button class="primary" id="unlockButton">Desbloquear</button></section></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const DB_NAME='mi-economia-personal-local',DB_VERSION=1,STATE_KEY='current',SNAPSHOT_LIMIT=12;
const CATEGORIES=['Alimentación','Servicios del hogar','Vehículo','Salud y farmacia','Ropa y calzado','Salida con la familia','Gastos personales','Abono extra a deudas','Imprevistos y otros','Diezmo y ofrendas'];
const ICONS={Panel:'M3 10.5 12 3l9 7.5M5 9v12h14V9M9 21v-7h6v7',Diezmos:'M12 3v18M5 8h14M5 16h14',Gastos:'M4 6h16M6 6v14h12V6M9 10h6M9 14h6',Ahorro:'M3 7h18v13H3zM3 11h18M7 16h4',Deudas:'M3 6h18v13H3zM6 10h5M6 15h3M15 13h3',Calendario:'M4 5h16v16H4zM8 3v4M16 3v4M4 10h16M8 14h2M13 14h3',Presupuesto:'M4 19V5M4 19h17M8 16v-4M12 16V8M16 16v-7',Reportes:'M5 3h10l4 4v14H5zM15 3v5h5M8 12h8M8 16h8',Configuración:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4 12h2m12 0h2M12 4v2m0 12v2',Ingresos:'M12 19V5M6 11l6-6 6 6M4 21h16',Egresos:'M12 5v14M6 13l6 6 6-6M4 3h16'};
const LABELS=['Panel','Ingresos','Gastos','Mi ahorro','Calendario','Deudas','Presupuesto','Reportes','Configuración'];
const $=sel=>document.querySelector(sel);
let db,state,section='Panel',month='',hideMoney=false,searchValue='',toastTimer,lockAt=0;
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const num=x=>{let n=Number(x);return Number.isFinite(n)&&n>=0?Math.round(n):0};
const fmt=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
function money(n){return hideMoney?'••••••':'$'+fmt.format(Math.round(Number(n)||0))}
function fmtMonth(m){if(!m)return'';return new Intl.DateTimeFormat('es-CO',{month:'long',year:'numeric'}).format(new Date(m+'-15T12:00:00'))}
function dateNow(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthNow(){return dateNow().slice(0,7)}
function monthDays(m){let [y,n]=m.split('-').map(Number),d=new Date(y,n-1,1),r=[];while(d.getMonth()===n-1){r.push(new Date(d));d.setDate(d.getDate()+1)}return r}
function sundays(m){return monthDays(m).filter(d=>d.getDay()===0).map(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}
function plusMonths(m,n){let [y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function dateMonth(m,day){if(!day)return'';let [y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate();return m+'-'+String(Math.min(Number(day),last)).padStart(2,'0')}
function dateLabel(d){if(!d)return'Flexible';let [y,m,day]=d.split('-');return day+'/'+m+'/'+y}
function moneyValue(n){return '<span class="amount">'+money(n)+'</span>'}
function ico(name){let d=ICONS[name]||ICONS.Panel;return '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="'+d+'"></path></svg></span>'}
function freshState(){return{schema:1,setupComplete:false,settings:{startMonth:'',availableOpening:0,savingsOpening:0,expectedGross:0,discounts:{national:0,social:0,district:0},weeklySaving:0,savingsGoal:0},fund:{name:'Mi ahorro'},debts:[],fixed:[],budgets:CATEGORIES.map(name=>({name,limit:0})),transactions:[],noTithe:[],security:{},createdAt:new Date().toISOString()}}
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');if(!d.objectStoreNames.contains('snapshots'))d.createObjectStore('snapshots',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function reqPromise(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function getState(){return reqPromise(db.transaction('state','readonly').objectStore('state').get(STATE_KEY))}
async function putState(v){return reqPromise(db.transaction('state','readwrite').objectStore('state').put(v,STATE_KEY))}
async function save(makeSnapshot=true){let previous=await getState();if(makeSnapshot&&previous){let s=clone(previous);if(s.security){delete s.security.pinSalt;delete s.security.pinHash}let idSnap=Date.now()+'-'+Math.random().toString(36).slice(2);await reqPromise(db.transaction('snapshots','readwrite').objectStore('snapshots').put({id:idSnap,createdAt:new Date().toISOString(),state:s}));let all=await reqPromise(db.transaction('snapshots','readonly').objectStore('snapshots').getAll());all.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));for(let old of all.slice(SNAPSHOT_LIMIT))await reqPromise(db.transaction('snapshots','readwrite').objectStore('snapshots').delete(old.id))}await putState(state);render()}
function txMonth(m=month){return state.transactions.filter(t=>(t.date||'').slice(0,7)===m)}
function availableBalance(){return state.settings.availableOpening+state.transactions.reduce((v,t)=>{if(t.type==='income')return v+num(t.net??t.amount);if(['expense','debtPayment','fixedPayment','transferToSavings'].includes(t.type))return v-num(t.amount);if(['transferFromSavings','transferUndo'].includes(t.type))return v+num(t.amount);return v},0)}
function savingsBalance(){return state.settings.savingsOpening+state.transactions.reduce((v,t)=>{if(t.type==='transferToSavings')return v+num(t.amount);if(['transferFromSavings','transferUndo'].includes(t.type))return v-num(t.amount);return v},0)}
function monthIncome(m=month){return txMonth(m).filter(t=>t.type==='income').reduce((v,t)=>v+num(t.net??t.amount),0)}
function monthGross(m=month){return txMonth(m).filter(t=>t.type==='income').reduce((v,t)=>v+num(t.gross??t.amount),0)}
function monthExpenses(m=month){return txMonth(m).filter(t=>['expense','debtPayment','fixedPayment'].includes(t.type)).reduce((v,t)=>v+num(t.amount),0)}
function lastCashActivity(){let t=state.transactions.slice().reverse().find(x=>['income','expense','debtPayment','fixedPayment','transferToSavings','transferFromSavings','transferUndo'].includes(x.type));if(!t)return'No hay movimientos todavía';let positive=['income','transferFromSavings','transferUndo'].includes(t.type);return labelType(t.type)+' '+(positive?'+':'−')+money(t.amount)}
function lastSavingsActivity(){let t=state.transactions.slice().reverse().find(x=>x.type.startsWith('transfer'));if(!t)return'Sin transferencias todavía';let positive=t.type==='transferToSavings';return labelType(t.type)+' '+(positive?'+':'−')+money(t.amount)}
function expenseByCategory(m=month,c){return txMonth(m).filter(t=>t.type==='expense'&&t.category===c).reduce((v,t)=>v+num(t.amount),0)}
function monthlyRate(d){let r=Number(d.rate)||0;return d.rateMode==='em'?r/100:Math.pow(1+r/100,1/12)-1}
function annualRate(d){let r=Number(d.rate)||0;return d.rateMode==='em'?Math.pow(1+r/100,12)-1:r/100}
function pmt(principal,months,rate){let p=num(principal),n=Math.max(1,num(months));if(!rate)return p/n;return p*rate/(1-Math.pow(1+rate,-n))}
function feeFor(d){if(d.fees!==''&&d.fees!=null)return num(d.fees);return Math.max(0,Math.round(num(d.payment)-pmt(d.principal,d.term,monthlyRate(d))))}
function installment(d,balance){let r=monthlyRate(d),interest=Math.round(num(balance)*r),fees=feeFor(d),capital=Math.max(0,num(d.payment)-interest-fees);capital=Math.min(num(balance),capital);return{interest,fees,capital,closing:Math.max(0,num(balance)-capital)}}
function debtBalance(d){let b=num(d.principal);for(let i=0;i<Math.min(num(d.paid),num(d.term));i++)b=installment(d,b).closing;return b}
function debtInterestPaid(d){let b=num(d.principal),total=0;for(let i=0;i<Math.min(num(d.paid),num(d.term));i++){let q=installment(d,b);total+=q.interest;b=q.closing}return total}
function debtPrincipalPaid(d){return Math.max(0,num(d.principal)-debtBalance(d))}
function debtNextMonth(d){return plusMonths(d.startMonth||state.settings.startMonth||month,Number(d.paid)||0)}
function debtDateForMonth(d,m){let next=debtNextMonth(d);if(m<d.startMonth)return'';if(m<next)return'';return dateMonth(m,d.day)}
function expectedNetGross(gross){let d=state.settings.discounts,nat=Math.round(gross*(Number(d.national)||0)/100),social=Math.round((gross-nat)*(Number(d.social)||0)/100),district=Math.round(gross*(Number(d.district)||0)/100);return{gross,national:nat,social,district,net:gross-nat-social-district}}
function noTithe(d){return state.noTithe.includes(d)}
function titheOn(d){return state.transactions.find(t=>t.type==='income'&&t.kind==='tithe'&&t.date===d)}
function estimatedMonthGross(m=month){let sund=sundays(m),missing=sund.filter(d=>!titheOn(d)&&!noTithe(d)).length;return monthGross(m)+Math.round((state.settings.expectedGross/Math.max(1,sund.length))*missing)}
function referenceDifference(m=month){return state.settings.expectedGross-monthGross(m)}
function receivedForSix(){let [y,mo]=month.split('-').map(Number),arr=[];for(let i=5;i>=0;i--){let d=new Date(y,mo-1-i,1),m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');arr.push({month:m,value:monthIncome(m)})}return arr}
function paid(ref,kind,m=month){return state.transactions.some(t=>t.type===(kind==='fixed'?'fixedPayment':'debtPayment')&&t.ref===ref&&t.date.startsWith(m))}
function obligations(m=month){let a=[];for(let x of state.fixed){if(!x.day)continue;let date=dateMonth(m,x.day);if(m>=state.settings.startMonth)a.push({id:x.id,name:x.name,amount:num(x.amount),date,kind:'fixed',paid:paid(x.id,'fixed',m)})}for(let d of state.debts){let date=debtDateForMonth(d,m);if(date&&debtBalance(d)>0)a.push({id:d.id,name:d.name,amount:num(d.payment),date,kind:'debt',paid:paid(d.id,'debt',m),debt:d})}return a.sort((x,y)=>x.date.localeCompare(y.date))}
function pendingTotal(m=month){return obligations(m).filter(x=>!x.paid).reduce((v,x)=>v+x.amount,0)}
function alertList(){if(!state.setupComplete)return [];let a=[],today=dateNow(),suns=sundays(month);for(let d of suns){if(d<=today&&!titheOn(d)&&!noTithe(d))a.push('Falta anotar el diezmo del domingo '+dateLabel(d)+'.')}for(let x of obligations(month).filter(z=>!z.paid)){let diff=Math.ceil((new Date(x.date+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);if(diff<0)a.push('Pago vencido: '+x.name+' ('+dateLabel(x.date)+').');else if(diff<=5)a.push('Pago próximo: '+x.name+' en '+diff+' día(s).')}if(availableBalance()<pendingTotal())a.push('El dinero disponible no cubre los pagos pendientes; faltan '+money(pendingTotal()-availableBalance())+'.');for(let b of state.budgets){let used=expenseByCategory(month,b.name),pc=b.limit?used/b.limit*100:0;if(b.limit&&pc>=100)a.push('Tope superado en '+b.name+'.');else if(b.limit&&pc>=80)a.push('Presupuesto de '+b.name+' llegó al 80%.')}return a}
function navMarkup(){return LABELS.map(x=>'<button data-section="'+esc(x)+'" '+(section===x?'aria-current="page"':'')+'>'+ico(x==='Mi ahorro'?'Ahorro':x)+'<span>'+esc(x)+'</span></button>').join('')}
function pageHead(title,sub,actions=''){return'<div class="welcome"><div><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div><div class="toolbar">'+actions+'</div></div>'}
function lineItem(title,detail,amount,kind=''){return'<div class="line"><div class="line-main"><strong>'+esc(title)+'</strong><small>'+esc(detail||'')+'</small></div><b class="'+esc(kind)+'">'+money(amount)+'</b></div>'}
function setupMarkup(){let st=state.settings;return'<div class="first-run"><div class="brand"><img src="./icons/icon-192.png" alt=""><div><strong>Mi economía personal</strong><small>Configuración inicial guardada localmente</small></div></div><section class="card"><h1>Empecemos por tus saldos</h1><p class="muted">Ingresa los valores desde esta pantalla. No vienen incluidos en el código ni se envían a ningún servidor. Después podrás completar deudas, pagos fijos y presupuestos en Configuración.</p><form id="setupForm"><div class="form-grid"><label>Fecha desde la que llevarás el control<input type="date" name="startDate" required value="'+esc(st.startMonth?st.startMonth+'-01':'')+'"></label><label>Dinero disponible al iniciar<input type="number" name="available" min="0" step="1" required value="'+(st.availableOpening||'')+'"></label><label>Ahorro acumulado al iniciar<input type="number" name="savings" min="0" step="1" required value="'+(st.savingsOpening||'')+'"></label><label>Diezmo bruto esperado al mes<input type="number" name="expected" min="0" step="1" value="'+(st.expectedGross||'')+'"></label><label>Descuento nacional (%)<input type="number" name="national" min="0" max="100" step="0.01" value="'+(st.discounts.national||'')+'"></label><label>Obra social (%)<input type="number" name="social" min="0" max="100" step="0.01" value="'+(st.discounts.social||'')+'"></label><label>Distrital (%)<input type="number" name="district" min="0" max="100" step="0.01" value="'+(st.discounts.district||'')+'"></label><label>Aporte semanal al ahorro<input type="number" name="weekly" min="0" step="1" value="'+(st.weeklySaving||'')+'"></label><label>Meta de ahorro<input type="number" name="goal" min="0" step="1" value="'+(st.savingsGoal||'')+'"></label></div><div class="section-actions"><button class="primary">Guardar y continuar</button></div></form><p class="setup-note">Tus movimientos y configuración se guardan en IndexedDB de este dispositivo. Para llevarlos a otro dispositivo usa Copia cifrada.</p></section></div>'}
function renderPanel(){let alerts=alertList(),ob=obligations(month).filter(x=>!x.paid).slice(0,5),inc=monthIncome(),gross=monthGross(),est=estimatedMonthGross();return pageHead('Resumen de '+fmtMonth(month),'Tus saldos se mantienen separados. Los gastos nunca descuentan del ahorro.')+'<div class="grid"><section class="card balance-card cash span6"><div class="eyebrow">TIENES AHORA · DINERO DISPONIBLE</div><div class="balance-number">'+money(availableBalance())+'</div><div class="balance-sub">Solo dinero para usar · saldo inicial '+money(state.settings.availableOpening)+'</div><div class="balance-sub">Último movimiento: '+esc(lastCashActivity())+'</div><button data-open-expense>Anotar gasto</button></section><section class="card balance-card savings span6"><div class="eyebrow">MI AHORRO · APARTE</div><div class="balance-number">'+money(savingsBalance())+'</div><div class="balance-sub">Aporte semanal '+money(state.settings.weeklySaving)+' · meta '+money(state.settings.savingsGoal)+'</div><div class="balance-sub">Última transferencia: '+esc(lastSavingsActivity())+'</div><button data-section="Mi ahorro">Ver ahorro</button></section><section class="card span4"><h2 class="card-title">'+ico('Ingresos')+' Diezmo del mes</h2><div class="stat tone-green">'+money(inc)+'</div><p class="month-diff">Recibido neto · bruto recibido '+money(gross)+'</p><p class="month-diff">Referencia bruta '+money(state.settings.expectedGross)+' · '+(referenceDifference()>=0?'faltan ':'por encima ')+money(Math.abs(referenceDifference()))+'</p><p class="mini">Estimado bruto con domingos pendientes: '+money(est)+'</p><button data-open-tithe>Anotar diezmo</button></section><section class="card span4"><h2 class="card-title">'+ico('Calendario')+' Próximos compromisos</h2>'+(ob.length?ob.map(x=>'<div class="line"><div class="line-main"><strong>'+esc(x.name)+'</strong><small>'+dateLabel(x.date)+'</small></div><b>'+money(x.amount)+'</b><button data-pay="'+esc(x.kind+':'+x.id)+'" aria-label="Marcar pagado: '+esc(x.name)+'">Pagar</button></div>').join(''):'<div class="empty">No hay pagos pendientes con fecha fija.</div>')+'<button data-section="Calendario">Ver calendario</button></section><section class="card span4"><h2 class="card-title">'+ico('Calendario')+' Avisos</h2>'+(alerts.length?alerts.map(x=>'<p class="notice '+(/vencido|no cubre|superado/.test(x)?'bad':'')+'">'+esc(x)+'</p>').join(''):'<div class="pill green">Todo al día</div>')+'</section><section class="card span7"><h2 class="card-title">'+ico('Reportes')+' Movimientos recientes</h2>'+recentMarkup()+'</section><section class="card span5"><h2 class="card-title">'+ico('Ingresos')+' Ingreso neto reciente</h2>'+incomeTrendMarkup()+'</section></div>'}
function recentMarkup(){let arr=txMonth().filter(t=>!searchValue||((t.note||'')+' '+(t.category||'')).toLowerCase().includes(searchValue.toLowerCase())).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);return arr.length?arr.map(t=>'<div class="line"><div class="line-main"><strong>'+esc(t.category||labelType(t.type))+'</strong><small>'+esc(dateLabel(t.date))+' · '+esc(t.note||labelType(t.type))+'</small></div><b class="'+(['income','transferFromSavings','transferUndo'].includes(t.type)?'tone-green':'tone-coral')+'">'+(['income','transferFromSavings','transferUndo'].includes(t.type)?'+':'−')+money(t.amount)+'</b></div>').join(''):'<div class="empty">Aún no hay movimientos en este mes. Usa el botón + para anotar el primero.</div>'}
function labelType(t){return({income:'Ingreso',expense:'Gasto',debtPayment:'Cuota de deuda',fixedPayment:'Pago fijo',transferToSavings:'Aporte al ahorro',transferFromSavings:'Retiro del ahorro',transferUndo:'Aporte deshecho'})[t]||'Movimiento'}
function incomeTrendMarkup(){return receivedForSix().map(x=>'<div class="line"><span>'+esc(fmtMonth(x.month))+'</span><b>'+money(x.value)+'</b></div>').join('')}
function renderIncome(){let ds=sundays(month);let cards=ds.map(d=>{let t=titheOn(d),no=noTithe(d);return'<div class="card"><div class="welcome"><div><h3>Domingo '+Number(d.slice(-2))+'</h3><p>'+dateLabel(d)+'</p></div><span class="pill '+(t?'green':no?'blue':'gold')+'">'+(t?'Anotado':no?'Sin diezmo':'Pendiente')+'</span></div>'+(t?'<p>Bruto <b>'+money(t.gross)+'</b> · nacional −'+money(t.national)+' · social −'+money(t.social)+' · distrital −'+money(t.district)+' · neto <b class="tone-green">'+money(t.net)+'</b></p><button data-tithe="'+esc(d)+'">Corregir</button>':no?'<p class="muted">Marcado como domingo sin diezmo.</p><button data-tithe="'+esc(d)+'">Anotar diezmo</button><button data-nodie="'+esc(d)+'">Deshacer marca</button>':'<button class="primary" data-tithe="'+esc(d)+'">Anotar diezmo bruto</button><button data-nodie="'+esc(d)+'">No hubo diezmo</button>')+'</div>'}).join('');let other=txMonth().filter(t=>t.type==='income'&&t.kind!=='tithe');return pageHead('Ingresos','El diezmo se registra bruto; los descuentos se calculan y solo el neto entra al dinero disponible.','<button data-other-income>Otro ingreso</button>')+'<div class="grid"><section class="card span12"><h2 class="card-title">'+ico('Diezmos')+' Diezmos de '+esc(fmtMonth(month))+'</h2><div class="grid">'+cards+'</div><div class="line"><b>Bruto recibido</b><b>'+money(monthGross())+'</b></div><div class="line"><b>Neto que entró al disponible</b><b class="tone-green">'+money(monthIncome())+'</b></div><p class="month-diff">Esperado bruto '+money(state.settings.expectedGross)+' · '+(referenceDifference()>=0?'faltan ':'por encima ')+money(Math.abs(referenceDifference()))+'</p></section><section class="card span12"><h2 class="card-title">'+ico('Ingresos')+' Otros ingresos</h2>'+(other.length?other.map(t=>lineItem(t.category,dateLabel(t.date)+' · '+t.note,t.amount,'tone-green')).join(''):'<div class="empty">Registra regalos u otros ingresos desde el botón.</div>')+'</section></div>'}
function renderExpenses(){let arr=txMonth().filter(t=>['expense','debtPayment','fixedPayment'].includes(t.type)).filter(t=>!searchValue||((t.note||'')+' '+(t.category||'')).toLowerCase().includes(searchValue.toLowerCase())).slice().sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Gastos y pagos','Cada salida baja únicamente el dinero disponible. El ahorro permanece igual.','<button class="primary" data-expense>Registrar gasto</button>')+'<section class="card"><h2 class="card-title">'+ico('Gastos')+' Salidas de '+esc(fmtMonth(month))+' · '+money(monthExpenses())+'</h2>'+(arr.length?arr.map(t=>'<div class="line"><div class="line-main"><strong>'+esc(t.category)+'</strong><small>'+esc(dateLabel(t.date))+' · '+esc(t.note||labelType(t.type))+'</small>'+(t.type==='debtPayment'?'<small>Capital '+money(t.capital)+' · intereses '+money(t.interest)+' · cargos '+money(t.fees)+'</small>':'')+'</div><b class="tone-coral">−'+money(t.amount)+'</b></div>').join(''):'<div class="empty">No hay gastos ni pagos anotados este mes.</div>')+'</section>'}
function activeUndoIds(){return new Set(state.transactions.filter(t=>t.type==='transferUndo'&&t.undoOf).map(t=>t.undoOf))}
function renderSavings(){let bal=savingsBalance(),goal=num(state.settings.savingsGoal),progress=goal?Math.min(100,bal/goal*100):0,ds=sundays(month),undos=activeUndoIds();let rows=ds.map(d=>{let t=state.transactions.find(x=>x.type==='transferToSavings'&&x.frequency==='weekly'&&x.date===d&&!undos.has(x.id));return'<button data-weekly="'+esc(d)+'" aria-label="'+(t?'Deshacer aporte semanal de '+money(t.amount):'Aportar '+money(state.settings.weeklySaving))+' para domingo '+Number(d.slice(-2))+'" aria-pressed="'+!!t+'">'+(t?'Deshacer '+money(t.amount)+' · ':'Aportar '+money(state.settings.weeklySaving)+' · ')+d.slice(-2)+'</button>'}).join('');let hist=state.transactions.filter(t=>t.type.startsWith('transfer')).sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Mi ahorro','Su saldo es independiente. Un aporte mueve dinero entre las dos tarjetas; un gasto no toca este saldo.')+'<div class="grid"><section class="card balance-card savings span6"><div class="eyebrow">SALDO DE AHORRO</div><div class="balance-number">'+money(bal)+'</div><div class="balance-sub">Meta '+money(goal)+' · aporte semanal '+money(state.settings.weeklySaving)+'</div><div class="progress" style="margin-top:12px"><span style="width:'+progress+'%"></span></div></section><section class="card span6"><h2 class="card-title">'+ico('Ahorro')+' Movimiento rápido</h2><p class="muted">Dinero disponible: <b>'+money(availableBalance())+'</b>. Aportar lo resta; retirar lo devuelve.</p><div class="section-actions"><button class="primary" data-add-saving>Añadir al ahorro</button><button data-withdraw-saving>Retirar del ahorro</button></div><p class="mini">Los retiros no pueden superar el saldo de ahorro.</p></section><section class="card span12"><h2 class="card-title">'+ico('Calendario')+' Apartado semanal</h2><p class="muted">Toca el domingo para aportar; si te equivocas, toca otra vez «Deshacer».</p><div class="week-grid">'+(rows||'<div class="empty">Este mes no tiene domingos.</div>')+'</div></section><section class="card span12"><h2 class="card-title">'+ico('Reportes')+' Historial de transferencias</h2>'+(hist.length?hist.map(t=>{let isIn=t.type==='transferToSavings',isUndo=t.type==='transferUndo';let undone=undos.has(t.id);return'<div class="line"><div class="line-main"><strong>'+esc(isUndo?'Aporte deshecho':isIn?'Aporte al ahorro':'Retiro del ahorro')+'</strong><small>'+esc(dateLabel(t.date))+' · '+esc(t.note||'Transferencia')+(undone?' · revertido':'')+'</small></div><div class="line-actions"><b class="history-sign '+(isIn?'tone-blue':'tone-green')+'">'+(isIn?'−':' + ')+money(t.amount)+'</b>'+(isIn&&!undone?'<button class="undo-button" data-undo="'+esc(t.id)+'">Deshacer</button>':'')+'</div></div>'}).join(''):'<div class="empty">Aún no hay aportes ni retiros. El saldo inicial permanece aparte.</div>')+'</section></div>'}
function renderDebts(){let ds=state.debts;let avalanche=ds.slice().sort((a,b)=>monthlyRate(b)-monthlyRate(a)),snowball=ds.slice().sort((a,b)=>debtBalance(a)-debtBalance(b));return pageHead('Deudas','Interés por cuota según la tasa; los cargos editables quedan separados del capital.','<button class="primary" data-add-debt>Agregar deuda</button>')+'<section class="card"><h2 class="card-title">'+ico('Deudas')+' Orden sugerido</h2><div class="grid"><div class="card span6"><b>Avalancha</b><p class="muted">Prioriza la tasa mensual más alta.</p>'+orderList(avalanche)+'</div><div class="card span6"><b>Bola de nieve</b><p class="muted">Prioriza el saldo más pequeño.</p>'+orderList(snowball)+'</div></div></section><section class="card" style="margin-top:14px"><h2 class="card-title">'+ico('Deudas')+' Tus créditos</h2>'+(ds.length?'<div class="debt-grid">'+ds.map(debtCard).join('')+'</div>':'<div class="empty-action"><p>Aún no agregas deudas. Usa “Agregar deuda” para ingresar entidad, cuota, tasa y plazo.</p><button class="primary" data-add-debt>Agregar deuda</button></div>')+'</section>'}

function debtCard(d){let bal=debtBalance(d),paid=Math.min(num(d.paid),num(d.term)),pct=d.term?Math.min(100,paid/d.term*100):0,rate=monthlyRate(d),next=debtDateForMonth(d,month),q=installment(d,bal),totalCost=d.payment*d.term-d.principal;return'<article class="debt-card"><div class="debt-head"><strong>'+esc(d.name)+'</strong><div><button data-edit-debt="'+esc(d.id)+'" aria-label="Editar '+esc(d.name)+'">Editar</button><button data-delete-debt="'+esc(d.id)+'" aria-label="Eliminar '+esc(d.name)+'">Quitar</button></div></div><div class="debt-amount">'+money(bal)+'</div><small class="muted">Saldo calculado · cuota '+money(d.payment)+'</small><div class="progress" style="margin:10px 0 5px"><span style="width:'+pct+'%"></span></div><small class="muted">Plazo: '+paid+' de '+d.term+' cuotas · faltan '+Math.max(0,d.term-paid)+'</small><div class="debt-meta"><span>Tasa '+(d.rateMode==='em'?fmt.format(d.rate)+'% E.M.':'— E.M.')+'</span><span>'+fmt.format(annualRate(d)*100)+'% E.A.</span></div><div class="debt-meta"><span>Capital pagado '+money(debtPrincipalPaid(d))+'</span><span>Intereses '+money(debtInterestPaid(d))+'</span></div><div class="debt-meta"><span>Seguro / cargos por cuota '+money(feeFor(d))+'</span><span>Próximo: '+(next?esc(dateLabel(next)):'—')+'</span></div><details><summary>Ver cálculo de cuota</summary><p>Interés estimado este mes: '+money(q.interest)+' · capital: '+money(q.capital)+' · seguros/cargos: '+money(q.fees)+' · pago: '+money(d.payment)+'.</p><p>Coste total pactado aproximado: '+money(totalCost)+' · meses restantes: '+Math.max(0,d.term-paid)+'.</p></details><button data-pay="debt:'+esc(d.id)+'" '+(paid>=d.term?'disabled':'')+'>Marcar cuota pagada</button></article>'}

function lockOnBackground(){document.addEventListener('visibilitychange',()=>{if(document.hidden)lockAt=Date.now();else if(lockAt&&Date.now()-lockAt>=60000&&state?.security?.pinHash){setLocked(true);lockAt=0}})}
function addTransfer(type,amount,date,note,extra={}){let t={id:id(),type,amount:num(amount),date,category:'Mi ahorro',note:note||'',...extra};state.transactions.push(t);return t}
async function undoTransfer(t){if(!t||t.type!=='transferToSavings')return showToast('Ese aporte ya no se puede deshacer.');if(activeUndoIds().has(t.id))return showToast('Ese aporte ya fue deshecho.');if(savingsBalance()<t.amount)return showToast('El ahorro disponible no alcanza para devolver ese aporte.');addTransfer('transferUndo',t.amount,dateNow(),'Deshacer aporte: '+(t.note||'Aporte al ahorro'),{undoOf:t.id});await save();showToast('Aporte revertido: el dinero volvió al disponible.')}
async function markPaid(kind,key){let x=obligations(month).find(o=>o.id===key&&o.kind===kind);if(!x||x.paid)return showToast('Este pago ya aparece pagado.');let today=dateNow(),type=kind==='fixed'?'fixedPayment':'debtPayment',t={id:id(),type,date:today,category:kind==='fixed'?'Pagos fijos':'Deudas',note:x.name,amount:x.amount,ref:x.id};if(kind==='debt'){let d=state.debts.find(z=>z.id===key),b=debtBalance(d),q=installment(d,b);Object.assign(t,{capital:q.capital,interest:q.interest,fees:q.fees,closingBalance:q.closing});d.paid=num(d.paid)+1;if(!Array.isArray(d.paidMonths))d.paidMonths=[];d.paidMonths.push(month)}state.transactions.push(t);await save();showToast('Pago registrado desde el dinero disponible.')}
async function handleClick(e){let b=e.target.closest('button');if(!b)return;if(b.dataset.section){section=b.dataset.section;render();return}if(b.hasAttribute('data-complete-setup')){section='Configuración';render();$('#settingsForm input').focus();return}if(b.id==='modalClose'||e.target===b.closest('.modal-backdrop'))return closeModal();if(!state.setupComplete&&(b.id==='fab'||b.hasAttribute('data-open-tithe')||b.hasAttribute('data-open-expense')||b.hasAttribute('data-open-income')||b.hasAttribute('data-add-saving')||b.hasAttribute('data-withdraw-saving')||b.dataset.tithe||b.dataset.weekly||b.dataset.pay||b.hasAttribute('data-expense')||b.hasAttribute('data-other-income'))){section='Configuración';render();showToast('Primero guarda tus saldos y descuentos en Configuración.');$('#settingsForm input').focus();return}if(b.id==='fab')return openModal('Registrar movimiento','<div class="section-actions"><button class="primary" data-open-tithe>Diezmo</button><button data-open-expense>Gasto</button><button data-open-income>Otro ingreso</button><button data-add-saving>Aportar al ahorro</button><button data-withdraw-saving>Retirar ahorro</button></div>');if(b.hasAttribute('data-open-tithe'))return titheForm(sundays(month).find(d=>!titheOn(d)&&!noTithe(d))||sundays(month)[0]||dateNow());if(b.hasAttribute('data-open-expense'))return movementForm('expense');if(b.hasAttribute('data-open-income'))return movementForm('income');if(b.hasAttribute('data-expense'))return movementForm('expense');if(b.hasAttribute('data-other-income'))return movementForm('income');if(b.hasAttribute('data-add-saving'))return transferForm('to');if(b.hasAttribute('data-withdraw-saving'))return transferForm('from');if(b.dataset.tithe)return titheForm(b.dataset.tithe);if(b.dataset.nodie){let d=b.dataset.nodie;if(noTithe(d))state.noTithe=state.noTithe.filter(x=>x!==d);else state.noTithe.push(d);await save();return}if(b.dataset.weekly){let d=b.dataset.weekly,existing=state.transactions.find(t=>t.type==='transferToSavings'&&t.frequency==='weekly'&&t.date===d&&!activeUndoIds().has(t.id));if(existing)return undoTransfer(existing);let amount=num(state.settings.weeklySaving);if(!amount)return showToast('Configura primero el aporte semanal.');if(availableBalance()<amount)return showToast('No hay suficiente dinero disponible para este aporte.');addTransfer('transferToSavings',amount,d,'Aporte semanal',{frequency:'weekly'});await save();return showToast('Aporte descontado del disponible y sumado al ahorro.')};if(b.dataset.undo){let t=state.transactions.find(x=>x.id===b.dataset.undo);return undoTransfer(t)}if(b.dataset.pay){let [k,key]=b.dataset.pay.split(':');return markPaid(k,key)}if(b.dataset.addDebt)return debtForm();if(b.dataset.editDebt)return debtForm(state.debts.find(x=>x.id===b.dataset.editDebt));if(b.dataset.deleteDebt){let d=state.debts.find(x=>x.id===b.dataset.deleteDebt);if(d&&confirm('¿Quitar '+d.name+'? Los pagos ya registrados permanecerán en movimientos.')){state.debts=state.debts.filter(x=>x.id!==d.id);await save()}return}if(b.dataset.addFixed)return fixedForm();if(b.dataset.editFixed)return fixedForm(state.fixed.find(x=>x.id===b.dataset.editFixed));if(b.dataset.deleteFixed){let f=state.fixed.find(x=>x.id===b.dataset.deleteFixed);if(f&&confirm('¿Quitar '+f.name+'? Los pagos registrados se conservan.')){state.fixed=state.fixed.filter(x=>x.id!==f.id);await save()}return}if(b.dataset.budget)return budgetForm(b.dataset.budget);if(b.hasAttribute('data-print'))return window.print();if(b.hasAttribute('data-csv'))return exportCSV();if(b.hasAttribute('data-pin'))return setPin();if(b.hasAttribute('data-backup'))return backupForm();if(b.hasAttribute('data-restore'))return restoreChoose();if(b.hasAttribute('data-history'))return showSnapshots();if(b.dataset.restoreSnapshot)return restoreSnapshot(b.dataset.restoreSnapshot);if(b.hasAttribute('data-clear')){if(confirm('Confirmación 1 de 2: se borrará todo el historial y la configuración.'))if(confirm('Confirmación 2 de 2: no hay forma de recuperar los datos sin una copia. ¿Borrar ahora?')){let all=await reqPromise(db.transaction('state','readonly').objectStore('state').getAllKeys());for(let k of all)await reqPromise(db.transaction('state','readwrite').objectStore('state').delete(k));state=freshState();await putState(state);section='Panel';render()}return} }
async function handleSubmit(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());if(e.target.id==='setupForm'){state.settings={...state.settings,startMonth:f.startDate.slice(0,7),availableOpening:num(f.available),savingsOpening:num(f.savings),expectedGross:num(f.expected),discounts:{national:Number(f.national)||0,social:Number(f.social)||0,district:Number(f.district)||0},weeklySaving:num(f.weekly),savingsGoal:num(f.goal)};state.fund={name:'Mi ahorro'};state.setupComplete=true;month=state.settings.startMonth;section='Panel';await putState(state);render();showToast('Configuración guardada solo en este dispositivo.');return}if(e.target.id==='settingsForm'){let settings={...state.settings,startMonth:f.startDate.slice(0,7),availableOpening:num(f.available),savingsOpening:num(f.savings),expectedGross:num(f.expected),discounts:{national:Number(f.national)||0,social:Number(f.social)||0,district:Number(f.district)||0},weeklySaving:num(f.weekly),savingsGoal:num(f.goal)};state.settings=settings;state.setupComplete=true;await save();showToast('Configuración actualizada.');return}if(e.target.id==='titheForm'){let d=f.date,g=num(f.gross),x=expectedNetGross(g),old=titheOn(d);if(old)state.transactions=state.transactions.filter(t=>t.id!==old.id);state.noTithe=state.noTithe.filter(q=>q!==d);state.transactions.push({id:id(),type:'income',kind:'tithe',date:d,category:'Diezmo',note:f.note||'Diezmo dominical',gross:g,national:x.national,social:x.social,district:x.district,net:x.net,amount:x.net});await save();closeModal();return showToast('Diezmo guardado: al disponible entró '+money(x.net)+'.')}if(e.target.id==='movementForm'){let amt=num(f.amount),kind=e.target.dataset.kind,cat=f.category==='Otro'?(prompt('Nombre de la categoría')||'Otro'):f.category;state.transactions.push({id:id(),type:kind==='income'?'income':'expense',date:f.date,category:cat,note:f.note||'',amount:amt,net:amt,gross:amt});await save();closeModal();return showToast(kind==='income'?'Ingreso agregado al disponible.':'Gasto descontado del disponible. El ahorro no se tocó.')}if(e.target.id==='transferForm'){let amount=num(f.amount),k=e.target.dataset.kind;if(amount<=0)return showToast('Escribe un monto mayor que cero.');if(k==='to'){if(amount>availableBalance())return showToast('No hay suficiente dinero disponible para aportar.');addTransfer('transferToSavings',amount,f.date,f.note||'Aporte manual')}else{if(amount>savingsBalance())return showToast('El retiro supera el ahorro disponible. No se guardó.');addTransfer('transferFromSavings',amount,f.date,f.note||'Retiro del ahorro')}await save();closeModal();return showToast(k==='to'?'Transferencia registrada: salió del disponible y entró al ahorro.':'Retiro registrado: salió del ahorro y volvió al disponible.')}if(e.target.id==='debtForm'){let d={id:e.target.dataset.id||id(),name:f.name.trim(),principal:num(f.principal),payment:num(f.payment),term:num(f.term),paid:num(f.paid),day:num(f.day),startMonth:f.startMonth,rateMode:f.rateMode,rate:Number(f.rate)||0,fees:f.fees===''?'':num(f.fees),paidMonths:[]};if(d.paid>d.term)return showToast('Cuotas pagadas no puede superar el plazo.');let idx=state.debts.findIndex(x=>x.id===d.id);if(idx>=0){d.paidMonths=state.debts[idx].paidMonths||[];state.debts[idx]=d}else state.debts.push(d);await save();closeModal();return showToast('Deuda guardada.')}if(e.target.id==='fixedForm'){let x={id:e.target.dataset.id||id(),name:f.name.trim(),amount:num(f.amount),day:f.day?num(f.day):0};let i=state.fixed.findIndex(y=>y.id===x.id);if(i>=0)state.fixed[i]=x;else state.fixed.push(x);await save();closeModal();return showToast('Pago fijo guardado.')}if(e.target.id==='budgetForm'){let x=state.budgets.find(y=>y.name===e.target.dataset.name);if(x)x.limit=num(f.limit);await save();closeModal();return showToast('Tope actualizado.')}if(e.target.id==='backupForm'){try{await createBackup(f.password);closeModal();showToast('Copia cifrada descargada.')}catch(e2){showToast(e2.message||'No se pudo crear la copia.')}return}}
function exportCSV(){let rows=[['Fecha','Tipo','Categoría','Nota','Monto bruto','Descuentos','Neto / valor'],...txMonth().map(t=>[t.date,labelType(t.type),t.category||'',t.note||'',t.gross??'',t.gross!=null?num(t.gross)-num(t.net):'',t.net??t.amount])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mi-economia-'+month+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setupEvents(){document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});$('#monthPicker').addEventListener('change',e=>{month=e.target.value||monthNow();render()});$('#hideAmounts').addEventListener('click',()=>{hideMoney=!hideMoney;render()});$('#themeButton').addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('mi-economia-theme',document.body.classList.contains('dark')?'dark':'light');$('#themeColor').content=document.body.classList.contains('dark')?'#121a17':'#087a5a';render()});$('#modalClose').addEventListener('click',closeModal);$('#searchInput').addEventListener('input',e=>{searchValue=e.target.value;let box=$('#searchResults'),items=state?.transactions.filter(t=>((t.category||'')+' '+(t.note||'')).toLowerCase().includes(searchValue.toLowerCase())).slice(-8).reverse()||[];if(!searchValue||!items.length){box.classList.remove('show');box.innerHTML='';return}box.innerHTML=items.map(t=>'<button data-search-month="'+esc(t.date.slice(0,7))+'"><b>'+esc(t.category||labelType(t.type))+'</b><br><small>'+esc(dateLabel(t.date))+' · '+money(t.amount)+'</small></button>').join('');box.classList.add('show');if(section==='Gastos'||section==='Panel')render()});$('#searchResults').addEventListener('click',e=>{let b=e.target.closest('[data-search-month]');if(b){month=b.dataset.searchMonth;section='Reportes';$('#searchResults').classList.remove('show');render()}});$('#unlockButton').addEventListener('click',unlock);$('#unlockPin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});}
async function init(){db=await openDB();state=await getState()||freshState();let theme=localStorage.getItem('mi-economia-theme');if(theme==='dark')document.body.classList.add('dark');month=state.settings.startMonth||monthNow();setupEvents();render();lockOnBackground();if(state.security?.pinHash)setTimeout(()=>{if(document.visibilityState==='hidden')lockAt=Date.now()},0);if('serviceWorker'in navigator&&window.isSecureContext)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{})}
init().catch(e=>{document.body.innerHTML='<main style="padding:24px"><h1>No se pudo abrir la aplicación</h1><p>'+esc(e.message)+'</p></main>'});
</script>
